<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>重力位能比一比</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #eef3f8; color: #223;
  }
  h1 { margin: 0 0 4px; font-size: 24px; text-align: center; }
  .sub { text-align: center; color: #567; margin-bottom: 12px; font-size: 14px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  canvas { width: 100%; height: auto; display: block; background: #fff; border-radius: 12px;
           box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  .panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .card { background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .card.A { border-top: 6px solid #e4574b; }
  .card.B { border-top: 6px solid #3b82d6; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row label { width: 92px; font-size: 15px; }
  .row input[type=range] { flex: 1; }
  .row .val { width: 62px; text-align: right; font-weight: bold; font-variant-numeric: tabular-nums; }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; justify-content: center; }
  button {
    border: 0; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer;
    background: #2e7d5b; color: #fff; font-family: inherit;
  }
  button.sec { background: #5b6b7d; }
  button.pre { background: #8a63c8; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .result { margin-top: 12px; background: #fff; border-radius: 12px; padding: 14px 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1); line-height: 1.7; }
  .result .formula { font-size: 17px; font-variant-numeric: tabular-nums; }
  .result .concl { margin-top: 6px; padding: 8px 12px; background: #fff7dc; border-left: 5px solid #f0b429; border-radius: 6px; }
  @media (max-width: 640px) { .panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚖️ 重力位能比一比</h1>
  <div class="sub">調整兩個物體的「質量」與「高度」，按下「放手！」，觀察位能大小與下落撞擊的效果</div>

  <canvas id="cv" width="960" height="650"></canvas>

  <div class="panel">
    <div class="card A">
      <h2>🟥 物體 A</h2>
      <div class="row"><label for="mA">質量 m</label><input type="range" id="mA" min="1" max="10" step="1" value="2"><span class="val" id="mAv"></span></div>
      <div class="row"><label for="hA">高度 h</label><input type="range" id="hA" min="1" max="10" step="0.5" value="5"><span class="val" id="hAv"></span></div>
    </div>
    <div class="card B">
      <h2>🟦 物體 B</h2>
      <div class="row"><label for="mB">質量 m</label><input type="range" id="mB" min="1" max="10" step="1" value="2"><span class="val" id="mBv"></span></div>
      <div class="row"><label for="hB">高度 h</label><input type="range" id="hB" min="1" max="10" step="0.5" value="8"><span class="val" id="hBv"></span></div>
    </div>
  </div>

  <div class="buttons">
    <button id="btnDrop">▶ 放手！</button>
    <button id="btnReset" class="sec">↺ 重置</button>
    <button id="btnPre1" class="pre">只比「高度」（質量相同）</button>
    <button id="btnPre2" class="pre">只比「質量」（高度相同）</button>
    <button id="btnPre3" class="pre">質量、高度都不同</button>
  </div>

  <div class="result" id="result"></div>
</div>

<script>
(function () {
  // ===== 常數與設定 =====
  const G = 9.8;                    // 重力加速度（國中階段視為定值）N/kg（= m/s²）
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const GROUND = 520;               // 地面 y 座標
  const PX_PER_M = 40;              // 每 1 公尺幾像素
  const MAX_E = 10 * G * 10;        // 最大位能 980 J（用於長條圖比例）
  const BAR_SCALE = 360 / MAX_E;    // 長條圖：每 1 J 的像素
  const SLOW = 0.6;                 // 慢動作倍率，方便觀察

  const objs = [
    { name: 'A', color: '#e4574b', dark: '#a8332a', x: 230, m: 2, h: 5 },
    { name: 'B', color: '#3b82d6', dark: '#245a9e', x: 450, m: 2, h: 8 }
  ];
  let mode = 'idle';               // idle | falling
  let effects = [];                // 撞擊效果
  let particles = [];
  let lastT = 0;

  // ===== 控制項 =====
  const el = id => document.getElementById(id);
  const sliders = [
    { o: objs[0], key: 'm', input: el('mA'), out: el('mAv'), unit: ' kg' },
    { o: objs[0], key: 'h', input: el('hA'), out: el('hAv'), unit: ' m' },
    { o: objs[1], key: 'm', input: el('mB'), out: el('mBv'), unit: ' kg' },
    { o: objs[1], key: 'h', input: el('hB'), out: el('hBv'), unit: ' m' }
  ];
  const btnDrop = el('btnDrop'), btnReset = el('btnReset');

  function syncFromSliders() {
    sliders.forEach(s => {
      s.o[s.key] = parseFloat(s.input.value);
      s.out.textContent = s.o[s.key] + s.unit;
    });
  }
  function setSliders(mA, hA, mB, hB) {
    el('mA').value = mA; el('hA').value = hA; el('mB').value = mB; el('hB').value = hB;
    syncFromSliders(); resetScene();
  }
  function setLocked(lock) {
    sliders.forEach(s => s.input.disabled = lock);
    ['btnPre1', 'btnPre2', 'btnPre3'].forEach(id => el(id).disabled = lock);
    btnDrop.disabled = lock;
  }

  sliders.forEach(s => s.input.addEventListener('input', () => { syncFromSliders(); resetScene(); }));
  btnDrop.addEventListener('click', startDrop);
  btnReset.addEventListener('click', resetScene);
  el('btnPre1').addEventListener('click', () => setSliders(3, 3, 3, 8));
  el('btnPre2').addEventListener('click', () => setSliders(2, 6, 8, 6));
  el('btnPre3').addEventListener('click', () => setSliders(6, 3, 2, 9));

  // ===== 狀態 =====
  function resetScene() {
    mode = 'idle';
    effects = []; particles = [];
    objs.forEach(o => { o.d = 0; o.v = 0; o.landed = false; o.sink = 0; o.sinkT = 0; o.depth = 0; });
    setLocked(false);
    updateResult();
  }
  function startDrop() {
    if (mode === 'falling') return;
    resetScene();
    mode = 'falling';
    setLocked(true);
  }

  function boxSize(m) { return 30 + m * 4; }
  function PE(o) { return o.m * G * Math.max(o.h - o.d, 0); }   // 目前位能
  function KE(o) { return 0.5 * o.m * o.v * o.v; }              // 目前動能
  const fmt = n => (Math.round(n * 10) / 10).toString();

  // ===== 物理更新 =====
  function update(dt) {
    if (mode !== 'falling') return;
    let allLanded = true;
    objs.forEach(o => {
      if (o.landed) return;
      o.v += G * dt;
      o.d += o.v * dt;
      if (o.d >= o.h) {
        o.d = o.h;
        o.v = Math.sqrt(2 * G * o.h);   // 著地瞬間速度
        o.landed = true;
        spawnImpact(o);
      } else allLanded = false;
    });
    if (allLanded) { mode = 'done'; setLocked(false); }
  }

  function spawnImpact(o) {
    const e = o.m * G * o.h;
    o.depth = 5 + 85 * (e / MAX_E);   // 凹陷深度與位能成正比（像素）
    o.sinkT = 0;
    effects.push({ x: o.x, e: e, t: 0, color: o.color });
    const n = Math.round(8 + (e / MAX_E) * 60);
    const speedBase = 40 + (e / MAX_E) * 220;
    for (let i = 0; i < n; i++) {
      const a = Math.PI * (0.1 + 0.8 * Math.random());
      const s = speedBase * (0.4 + Math.random() * 0.8);
      particles.push({
        x: o.x + (Math.random() - 0.5) * boxSize(o.m),
        y: GROUND, vx: Math.cos(a) * s * (Math.random() < .5 ? -1 : 1) * 0.8,
        vy: -Math.sin(a) * s, life: 1, color: o.dark
      });
    }
  }

  // ===== 繪圖 =====
  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    objs.forEach(drawPit);
    drawRuler();
    objs.forEach(drawObject);
    drawEffects();
    drawBars();
    drawGBox();
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#dff1ff'); g.addColorStop(1, '#f7fbff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
    ctx.fillStyle = '#8b6b4a'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#6c9a47'; ctx.fillRect(0, GROUND, W, 8);
    ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('地面（高度 0 m）', 80, GROUND + 30);
  }

  // 地面凹陷：深度隨物體「落地前的位能」增加
  function drawPit(o) {
    if (!o.landed || !o.sink || o.sink < 1) return;
    const s = boxSize(o.m), d = o.sink;
    const wt = s + 30 + d * 0.6;     // 坑口寬
    const wb = s + 6;                // 坑底寬
    const x0 = o.x - wt / 2, x1 = o.x + wt / 2;
    const b0 = o.x - wb / 2, b1 = o.x + wb / 2;
    const yTop = GROUND - 1, yBot = GROUND + d;

    ctx.save();
    // 坑洞本體
    ctx.beginPath();
    ctx.moveTo(x0, yTop);
    ctx.lineTo(b0, yBot - 6);
    ctx.quadraticCurveTo(b0, yBot, b0 + 6, yBot);
    ctx.lineTo(b1 - 6, yBot);
    ctx.quadraticCurveTo(b1, yBot, b1, yBot - 6);
    ctx.lineTo(x1, yTop);
    ctx.closePath();
    ctx.fillStyle = '#4a3622';
    ctx.fill();
    ctx.strokeStyle = '#2f2114'; ctx.lineWidth = 2; ctx.stroke();

    // 坑口兩側隆起的土堆
    ctx.fillStyle = '#6c9a47';
    ctx.beginPath(); ctx.ellipse(x0 - 4, GROUND, 8 + d * 0.08, 3 + d * 0.05, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x1 + 4, GROUND, 8 + d * 0.08, 3 + d * 0.05, 0, Math.PI, 0); ctx.fill();

    // 凹陷深度標示（坑右側的尺標）
    if (o.landed && d >= o.depth - 0.5) {
      const lx = x1 + 14;
      ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(lx, GROUND + 2); ctx.lineTo(lx, yBot); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx - 5, GROUND + 2); ctx.lineTo(lx + 5, GROUND + 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx - 5, yBot); ctx.lineTo(lx + 5, yBot); ctx.stroke();
      ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('凹陷', lx + 8, GROUND + d / 2 + 5);
    }
    ctx.restore();
  }

  function drawRuler() {
    ctx.strokeStyle = '#8899aa'; ctx.fillStyle = '#556';
    ctx.lineWidth = 1; ctx.font = '12px sans-serif'; ctx.textAlign = 'right';
    for (let k = 0; k <= 10; k++) {
      const y = GROUND - k * PX_PER_M;
      ctx.beginPath(); ctx.moveTo(60, y); ctx.lineTo(k % 5 === 0 ? 76 : 70, y); ctx.stroke();
      ctx.fillText(k + ' m', 54, y + 4);
      ctx.save(); ctx.strokeStyle = 'rgba(120,140,160,.18)';
      ctx.beginPath(); ctx.moveTo(76, y); ctx.lineTo(670, y); ctx.stroke(); ctx.restore();
    }
    ctx.beginPath(); ctx.moveTo(60, GROUND); ctx.lineTo(60, GROUND - 10 * PX_PER_M); ctx.lineWidth = 2; ctx.stroke();
  }

  function drawObject(o) {
    const s = boxSize(o.m);
    const bottomY = GROUND - (o.h - o.d) * PX_PER_M + (o.sink || 0);   // 物體底部 y（落地後會陷入坑中）
    const left = o.x - s / 2, top = bottomY - s;

    // 高度虛線與標示（尚未落地時）
    if (!o.landed) {
      ctx.save();
      ctx.setLineDash([6, 5]); ctx.strokeStyle = o.dark; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(o.x, bottomY); ctx.lineTo(o.x, GROUND); ctx.stroke();
      ctx.restore();
      const hNow = Math.max(o.h - o.d, 0);
      ctx.fillStyle = o.dark; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('h = ' + fmt(hNow) + ' m', o.x + 8, (bottomY + GROUND) / 2 + 5);
    }

    // 方塊
    ctx.fillStyle = o.color; ctx.strokeStyle = o.dark; ctx.lineWidth = 3;
    ctx.fillRect(left, top, s, s); ctx.strokeRect(left, top, s, s);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(left + 4, top + 4, s - 8, 8);

    // 文字
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 18px sans-serif'; ctx.fillText(o.name, o.x, top + s / 2 + 2);
    ctx.font = '13px sans-serif'; ctx.fillText(o.m + ' kg', o.x, top + s / 2 + 20);
  }

  function drawEffects() {
    effects.forEach(f => {
      const r = 10 + f.t * (60 + (f.e / MAX_E) * 160);
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - f.t);
      ctx.strokeStyle = f.color; ctx.lineWidth = 3 + (f.e / MAX_E) * 6;
      ctx.beginPath(); ctx.ellipse(f.x, GROUND + 2, r, r * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });
    particles.forEach(p => {
      ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
  }

  function drawBars() {
    const px = 700, pw = 240;
    ctx.fillStyle = '#f4f7fb'; ctx.strokeStyle = '#c7d2de'; ctx.lineWidth = 1;
    ctx.fillRect(px, 20, pw, GROUND - 20); ctx.strokeRect(px, 20, pw, GROUND - 20);
    ctx.fillStyle = '#223'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('能量長條圖（單位：焦耳 J）', px + pw / 2, 44);

    // 圖例
    ctx.font = '12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillStyle = '#2e9e6a'; ctx.fillRect(px + 20, 54, 12, 12); ctx.fillStyle = '#334'; ctx.fillText('重力位能', px + 36, 65);
    ctx.fillStyle = '#f08a24'; ctx.fillRect(px + 110, 54, 12, 12); ctx.fillStyle = '#334'; ctx.fillText('動能（運動能量）', px + 126, 65);

    const base = GROUND - 30;
    objs.forEach((o, i) => {
      const bx = px + 40 + i * 100, bw = 60;
      const pe = PE(o), ke = Math.max(o.m * G * o.h - pe, 0);   // 總能量守恆：動能 = 原位能 − 現位能
      const hpe = pe * BAR_SCALE * 0.95, hke = ke * BAR_SCALE * 0.95;
      ctx.fillStyle = '#2e9e6a'; ctx.fillRect(bx, base - hpe, bw, hpe);
      ctx.fillStyle = '#f08a24'; ctx.fillRect(bx, base - hpe - hke, bw, hke);
      ctx.strokeStyle = o.dark; ctx.lineWidth = 2; ctx.strokeRect(bx, base - hpe - hke, bw, hpe + hke);
      ctx.fillStyle = o.dark; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(o.name, bx + bw / 2, base + 20);
      // 數值
      ctx.font = '13px sans-serif';
      ctx.fillStyle = '#1f7a50'; ctx.fillText('位能 ' + fmt(pe), bx + bw / 2, base - hpe - hke - 24);
      ctx.fillStyle = '#c96a10'; ctx.fillText('動能 ' + fmt(ke), bx + bw / 2, base - hpe - hke - 8);
    });
    ctx.strokeStyle = '#556'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px + 20, base); ctx.lineTo(px + pw - 20, base); ctx.stroke();
  }

  function drawGBox() {
    const x = 90, y = 14, w = 270, h = 56;
    ctx.fillStyle = 'rgba(255,248,214,.95)'; ctx.strokeStyle = '#e0b43a'; ctx.lineWidth = 2;
    ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = '#5a4300'; ctx.textAlign = 'left';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('重力加速度 g = 9.8 N/kg（定值）', x + 10, y + 24);
    ctx.font = '14px sans-serif';
    ctx.fillText('重力位能 U = m × g × h', x + 10, y + 44);
  }

  // ===== 結果說明 =====
  function updateResult() {
    const [a, b] = objs;
    const UA = a.m * G * a.h, UB = b.m * G * b.h;
    const f = (o, U) => `${o.m} × ${G} × ${o.h} = <b>${fmt(U)} J</b>`;
    let concl;
    const sameM = a.m === b.m, sameH = a.h === b.h;
    if (sameM && sameH) {
      concl = '兩個物體的質量與高度都相同，所以位能一樣大。';
    } else if (sameM) {
      const hi = a.h > b.h ? 'A' : 'B';
      concl = `✔ 質量相同（都是 ${a.m} kg），物體 ${hi} 的位置比較高，所以 <b>位能比較大</b>。<br>👉 結論：質量相同時，<b>高度越高，位能越大</b>。`;
    } else if (sameH) {
      const hi = a.m > b.m ? 'A' : 'B';
      concl = `✔ 高度相同（都是 ${a.h} m），物體 ${hi} 的質量比較大，所以 <b>位能比較大</b>。<br>👉 結論：高度相同時，<b>質量越大，位能越大</b>。`;
    } else {
      let cmp;
      if (UA === UB) cmp = '兩者位能一樣大！（質量與高度的乘積相同）';
      else cmp = `物體 ${UA > UB ? 'A' : 'B'} 的位能比較大。`;
      concl = `質量和高度都不一樣，要把 m × g × h 算出來才能比較：${cmp}<br>👉 結論：位能大小同時取決於 <b>質量</b> 和 <b>高度</b>。`;
    }
    let extra = '';
    if (mode === 'done') {
      const deeper = UA === UB ? '兩個坑一樣深' : `物體 ${UA > UB ? 'A' : 'B'} 造成的坑比較深`;
      extra = `<br>🔸 下落過程中，位能轉換成動能；著地時動能把地面壓出凹陷。${deeper}，` +
              `可見<b>位能越大，對地面做的功越多，地面凹陷越深</b>。`;
    }
    el('result').innerHTML =
      `<div class="formula">🟥 A：U = m × g × h = ${f(a, UA)}</div>` +
      `<div class="formula">🟦 B：U = m × g × h = ${f(b, UB)}</div>` +
      `<div class="concl">${concl}${extra}</div>`;
  }

  // ===== 主迴圈 =====
  let wasDone = false;
  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05) * SLOW;
    lastT = t;
    update(dt);

    // 落地後物體逐漸陷入地面（先快後慢）
    objs.forEach(o => {
      if (!o.landed) return;
      o.sinkT += dt;
      const k = Math.min(o.sinkT / 0.3, 1);
      o.sink = o.depth * (1 - Math.pow(1 - k, 3));
    });

    effects.forEach(f => f.t += dt * 1.2);
    effects = effects.filter(f => f.t < 1);
    particles.forEach(p => {
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 0.9;
      if (p.y > GROUND) { p.y = GROUND; p.vy *= -0.3; p.vx *= 0.7; }
    });
    particles = particles.filter(p => p.life > 0);

    if (mode === 'done' && !wasDone) { updateResult(); }
    wasDone = (mode === 'done');
    if (mode === 'idle') wasDone = false;

    draw();
    requestAnimationFrame(loop);
  }

  // 初始化
  syncFromSliders();
  resetScene();
  requestAnimationFrame(t => { lastT = t; loop(t); });
})();
</script>
</body>
</html>
